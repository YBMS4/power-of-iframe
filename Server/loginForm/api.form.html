<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./public/lib/floatingLabel.css">
    <script type="module" src="./public/lib/floatingLabelScript.js" defer></script>
    <link rel="stylesheet" href="./components/style">
    <script type="module" src="./components/script" defer></script>
    <title>Our API Form</title>
</head>
<body>
    
    <header>
        <figure>
            <img src="http://localhost:3000/public/myLogo2.svg" alt="MyLogo">
            <figcaption>Login</figcaption>
        </figure>
    </header>

    <main>
        <form>
            <div>
                <label for="email" class="floating-label check-validation">
                    <input id="email" autocomplete="off" type="email" name="email" required>
                    <span class="label">Email</span>
                </label>
    
                <label for="password" class="floating-label check-validation">
                    <input id="password" autocomplete="off" type="password" name="password" required>
                    <span class="label">Password</span>
                </label>
            </div>

            <button type="submit">Submit</button>
        </form>
    </main>
</body>
</html>
